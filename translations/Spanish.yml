hoo_help_key_lmb_holding_copy: "Clic izquierdo, sujetando una copia"
hoo_help_key_lmb: "Clic izquierdo"
hoo_help_key_mmb_twice_or: "Botón central dos veces, o $1"
hoo_help_key_drag_scroll_preview: "Arrastrar / rueda sobre la vista previa"
hoo_help_key_hold_arrows: "Mantener $1 + flechas"
hoo_help_key_movement: "Teclas de movimiento"
hoo_help_key_use: "Tu tecla de usar"
hoo_help_master: "El interruptor general"
hoo_help_master_toggle: "Activar o desactivar todo el mod"
hoo_help_master_note1: "El martillo brilla y suelta leves chispas mientras está activo. Todo salvo la cámara de construcción se limita a las herramientas que construyen, así que la azada, el cultivador y las herramientas de terreno de otros mods solo tienen la cámara. Desactivar el mod devuelve sus teclas y deja el juego tal cual - las piezas que ya doblaste o escalaste conservan su forma."
hoo_help_master_note1_still: "Girar, escalar, doblar, desplazar y hacer zoop solo funcionan mientras estás quieto."
hoo_help_master_note2: "La franja de la esquina muestra las teclas que hacen algo ahora mismo, y cambia al mantener un modificador, una copia o una selección. Los mensajes aparecen en el panel propio del mod y duran lo bastante para leerlos. Mientras se levanta un edificio tuyo, un panel muestra lo que aún necesita. Los tres se mueven y redimensionan en la configuración: Key Hints, Messages, Building Panel."
hoo_help_rotating: "Girar piezas"
hoo_help_rot_turn: "Girar la pieza en el plano horizontal"
hoo_help_rot_pitch: "Cabeceo: inclinarla adelante y atrás"
hoo_help_rot_roll: "Alabeo: inclinarla a izquierda y derecha"
hoo_help_rot_yaw_aim: "Guiñada según la mirada: empujar en la línea de colocación"
hoo_help_rot_reset_axis: "Restablecer solo el eje que estás manteniendo"
hoo_help_rot_reset_all: "Restablecer todos los ejes de giro a la vez"
hoo_help_rot_finer: "Pasos de giro más finos (más divisiones)"
hoo_help_rot_coarser: "Pasos de giro más gruesos (menos divisiones)"
hoo_help_rot_note: "Configurado ahora a $1 pasos por vuelta completa ($2° por clic)."
hoo_help_scaling: "Escalado de precisión"
hoo_help_scale_hold: "Mantén este modificador al usar las teclas de escala de abajo"
hoo_help_scale_wider: "Más ancha"
hoo_help_scale_narrower: "Más estrecha"
hoo_help_scale_taller: "Más alta"
hoo_help_scale_shorter: "Más baja"
hoo_help_scale_deeper: "Más profunda"
hoo_help_scale_shallower: "Menos profunda"
hoo_help_scale_bigger: "Más grande (uniforme)"
hoo_help_scale_smaller: "Más pequeña (uniforme)"
hoo_help_scale_reset: "Devolver la pieza a su tamaño normal de 1.0x"
hoo_help_scale_note_all: "Cualquier pieza se puede redimensionar, incluidas estaciones y barcos."
hoo_help_scale_note_stations: "Las estaciones de fabricación y producción conservan su tamaño normal."
hoo_help_scale_note_usable: "Todo lo que se puede usar conserva su tamaño normal."
hoo_help_scale_note_range: "Rango de escala: $1x a $2x en pasos de $3. Las piezas escaladas se mantienen al recargar el mundo y se sincronizan con todos los jugadores."
hoo_help_bending: "Doblar y curvar vigas"
hoo_help_bend_curve: "Curvar la pieza de forma continua en ambos sentidos"
hoo_help_bend_swap: "Cambiar el eje de la curva"
hoo_help_bend_straighten: "Enderezar la pieza de nuevo"
hoo_help_bend_note: "Mientras mantienes $1, el indicador ilumina el anillo alrededor del que gira la curva, y un mensaje dice hacia dónde se curvarán los extremos - arriba, abajo, izquierda, derecha, hacia ti o alejándose. Las piezas se doblan a lo largo de su lado más largo, hasta $2° (180° convierten una viga recta en un arco semicircular). Solo se doblan las piezas estructurales sólidas; el menú de construcción las marca con un pequeño arco."
hoo_help_placing: "Colocación libre y desplazamiento"
hoo_help_place_free: "Colocación libre: sin colisión / sin fijar a superficies"
hoo_help_place_surface: "Colocación sobre superficie: alinear a ras con la superficie que apuntas"
hoo_help_place_freeze: "Fijar el fantasma de colocación: dejarlo en el aire para verlo desde todos los ángulos"
hoo_help_place_grid: "Activar el ajuste a la rejilla del mundo ($1m)"
hoo_help_place_clipping: "Permitir que las piezas se solapen"
hoo_help_nudge_depth: "Desplazar en profundidad: adelante y atrás"
hoo_help_nudge_horizontal: "Desplazar en horizontal: izquierda y derecha"
hoo_help_nudge_vertical: "Desplazar en vertical: arriba y abajo"
hoo_help_nudge_large: "Mantener para pasos de desplazamiento mayores"
hoo_help_nudge_reset: "Devolver todos los desplazamientos a cero"
hoo_help_nudge_note: "Paso de desplazamiento: $1m (fino), o $2m (manteniendo la tecla de paso grande). Una pulsación mueve un paso; mantén una tecla de desplazamiento, escala o separación de zoop y se repite tras un momento."
hoo_help_free_note: "La colocación libre ignora: $1"
hoo_help_free_note_workbench: "No hace falta banco de trabajo mientras está activada."
hoo_help_free_note_ward: "La zona protegida de otro siempre se respeta."
hoo_help_freedom_vanilla: "ninguna regla - solo cambia el ajuste."
hoo_help_freedom_surfaces: "sobre qué puede apoyarse una pieza."
hoo_help_freedom_spacing: "sobre qué puede apoyarse una pieza, y el espacio que necesita."
hoo_help_freedom_everything: "las reglas de superficie, espacio, bioma, mazmorra y clima."
hoo_help_freedom_unrestricted: "todas las reglas, incluidas las zonas sin construcción y los personajes que estorban."
hoo_help_snapping: "Puntos de ajuste y edición en el sitio"
hoo_help_snap_cycle: "Alternar los anclajes de ajuste derivados: centro, cara y arista"
hoo_help_snap_edit: "Edición en el sitio: tomar una pieza ya construida para redimensionarla, girarla o recolocarla"
hoo_help_snap_note: "Una pieza editada empieza fijada justo donde está, así que los ajustes pequeños siguen siendo pequeños; pulsa $1 para que siga tu mirada en un movimiento mayor. Colocar o cancelar la libera. Editar conserva la salud y los materiales de la pieza sin coste adicional. Los contenedores, carteles y soportes de objetos con algo dentro no se pueden editar solos - selecciónalos y mueve la selección, lo que conserva su contenido."
hoo_help_selecting: "Seleccionar varias piezas"
hoo_help_sel_toggle: "Añadir la pieza que miras, o quitarla"
hoo_help_sel_grow: "Ampliar: añadir todo lo que toca"
hoo_help_sel_shrink: "Reducir una ampliación"
hoo_help_sel_building: "Añadir todo el edificio conectado"
hoo_help_sel_type: "Añadir solo las piezas conectadas del tipo que miras"
hoo_help_sel_clear: "Borrar la selección"
hoo_help_sel_note: "Las piezas seleccionadas brillan mientras tienes en la mano una herramienta de construcción. Seleccionar nunca quita una pieza, aunque el clic central sea el quitar del martillo. Una selección admite hasta $1 piezas y se conserva hasta que la borras o sales del mundo."
hoo_help_sel_note_count: "$1 seleccionadas ahora mismo."
hoo_help_sel_note_none: "Nada seleccionado ahora mismo."
hoo_help_groups: "Mover, copiar y desmontar una selección"
hoo_help_groups_move: "Mover toda la selección en el sitio - los cofres conservan su contenido"
hoo_help_groups_copy: "Copiar la selección, para construirla en otro lugar"
hoo_help_groups_takedown: "Desmontar la selección - recuperas los materiales, deshacer la vuelve a levantar"
hoo_help_groups_save: "Sin nada en la mano: guardar la selección como plano"
hoo_help_groups_note1: "Un grupo sujeto se redimensiona por igual con las teclas de escala uniforme, y gira y se desplaza como una sola pieza. Las copias son piezas nuevas: los cofres llegan vacíos y los soportes sin objetos, el texto de los carteles se copia."
hoo_help_groups_note_unlearned_in: "Las plantas se omiten, y las piezas que no has aprendido se incluyen (lo decide el servidor)."
hoo_help_groups_note_unlearned_out: "Las plantas se omiten, y también las piezas que no has aprendido - se listan."
hoo_help_groups_note2: "No hace falta estación de trabajo para mover, copiar o desmontar una selección. Las piezas que no se pueden mover ni desmontar - zona protegida de otro, en uso - se nombran y se deseleccionan."
hoo_help_copying: "Copias y obras"
hoo_help_copy_place: "Colocarla: lo que puedes pagar llega volando, de abajo arriba. La copia sigue en la mano para colocarla otra vez"
hoo_help_copy_stop: "En un edificio que aún se levanta: detenerlo donde está"
hoo_help_copy_takedown: "En cualquier pieza de una copia: desmontar toda la copia, incluso tras reiniciar"
hoo_help_copy_note1: "Una copia que no puedes pagar entera espera como fantasma y sigue sola cuando aparecen materiales - encima de ti, en una mochila de AdventureBackpacks, o en cofres al alcance con AzuCraftyBoxes - mientras estés a menos de $1m. Se guarda con el mundo, y otros jugadores con el mod ven su fantasma. El panel de obra muestra lo que aún necesita."
hoo_help_copy_note2: "Deshacer desmonta una copia y devuelve los materiales a donde estaban - los cofres que los guardan, tu mochila, tu inventario - y lo que no quepa en ningún sitio cae a tus pies. Funciona mientras aún sujetas la copia, así que puedes poner varias y retirarlas una a una."
hoo_help_models: "Maquetas"
hoo_help_model_toggle: "Sujetando una copia o un plano: convertirlo en miniatura"
hoo_help_model_size: "Maqueta más grande / más pequeña"
hoo_help_model_raise: "Subirla / bajarla con precisión, un centímetro por pulsación"
hoo_help_model_place: "Ponerla sobre la parte superior de una mesa o un suelo"
hoo_help_model_off: "Sobre su mesa: quitar la maqueta"
hoo_help_model_note: "Una maqueta se dibuja, no se construye: un solo objeto guardado por grande que sea el edificio, que cuesta una resina, más una madera y una piedra si el edificio las usa. Deshacer la vuelve a quitar. Las maquetas a más de $1m no se dibujan."
hoo_help_blueprints: "Planos"
hoo_help_bp_book: "Con el martillo en la mano: abrir el libro de planos"
hoo_help_bp_save: "Con una selección y nada en la mano: guardarla como plano"
hoo_help_bp_preview: "Girar / acercar la vista previa de la maqueta; el botón de arriba guarda esa vista como su imagen"
hoo_help_bp_note1: "Los planos son archivos de PlanBuild, guardados en BepInEx/config/PlanBuild - los planos de PlanBuild, Infinity Hammer y BuildShare se abren aquí, y PlanBuild e Infinity Hammer pueden abrir los tuyos. Las piezas escaladas conservan su tamaño en los tres; las curvas también se ven en Infinity Hammer, donde este mod está instalado. Al tomarlo, un plano se sujeta y se coloca igual que una copia."
hoo_help_bp_note2: "Guardar sobre un plano pregunta antes y conserva el antiguo como archivo .bak. Una selección recuerda el plano con el que se guardó o del que se construyó. Las piezas de mods no instalados aquí, los tamaños fuera de los límites del servidor y el modelado del terreno (una opción del libro) se muestran antes de colocar."
hoo_help_runs: "Filas de zoop y deshacer al instante"
hoo_help_runs_zoop: "Extender una fila o rejilla de copias (zoop) antes de colocar"
hoo_help_runs_gap_wider: "Más separación"
hoo_help_runs_gap_narrower: "Menos separación / solapamiento"
hoo_help_runs_undo: "Deshacer: retirar lo último que hiciste - una fila, una copia, un movimiento, un desmontaje"
hoo_help_runs_redo: "Rehacer: volver a hacer lo último que deshiciste (las piezas reconstruidas se pagan de nuevo)"
hoo_help_runs_gap_none: "ninguna, se tocan"
hoo_help_runs_gap_metres: "$1m"
hoo_help_runs_gap_overlap: "$1m de solapamiento"
hoo_help_runs_note: "Separación entre copias: $1, en pasos de $2m. $3 la restablece junto con el zoop. Construye hasta $4 copias seguidas de un solo clic. Deshacer recuerda las últimas $5 acciones de colocación,"
hoo_help_runs_note_refund: "devolviendo los recursos directamente a tu inventario."
hoo_help_runs_note_drop: "soltando los materiales donde estaban las piezas."
hoo_help_camera: "Cámara de construcción separada"
hoo_help_cam_toggle: "Activar la cámara de construcción de vuelo libre"
hoo_help_cam_fly: "Volar por la obra (W / A / S / D)"
hoo_help_cam_vertical: "Volar en vertical arriba y abajo"
hoo_help_cam_boost: "Vuelo rápido de la cámara"
hoo_help_cam_note: "El personaje se queda quieto mientras la colocación apunta desde la cámara voladora. Alcance de la cámara: $1m desde el personaje."
hoo_help_cam_note_pickup: "La cámara recoge los objetos sueltos al volar."
hoo_help_doors: "Puertas"
hoo_help_doors_open: "Abrir la puerta que apuntas con una herramienta de construcción en la mano"
hoo_help_doors_note: "Alcance: $1m. Solo puertas - cofres, estaciones y todo lo demás quedan bloqueados mientras tienes una herramienta de construcción, para que nada se abra por accidente al alinear una pieza."
hoo_help_stations: "Alcance del banco de trabajo y alcance ampliado"
hoo_help_stations_radius: "Ampliar o reducir el radio del banco de trabajo"
hoo_help_stations_note: "Rango configurable: $1m a $2m. El radio se guarda por estación."
hoo_help_stations_note_reach: "El alcance de construcción llega a cualquier punto dentro del aura del banco de trabajo (hasta $1m)."
hoo_more_kinds: "$1 tipos más"
hoo_more_kinds_in_log: "$1 tipos más, listados en el registro"
