hoo_help_key_mmb_twice_selected: "Clic molette deux fois sur une pièce sélectionnée"
hoo_help_key_lmb_holding_copy: "Clic gauche, une copie en main"
hoo_help_key_lmb: "Clic gauche"
hoo_help_key_mmb_twice_or: "Clic molette deux fois, ou $1"
hoo_help_key_drag_scroll_preview: "Glisser / molette sur l'aperçu"
hoo_help_key_hold_arrows: "Maintenir $1 + flèches"
hoo_help_key_movement: "Touches de déplacement"
hoo_help_key_use: "Ta touche Utiliser"
hoo_help_master: "L'interrupteur général"
hoo_help_master_toggle: "Activer ou désactiver tout le mod"
hoo_help_master_note1: "Le marteau brille et lâche de légères braises quand il est actif. Tout sauf la caméra de construction est limité aux outils qui construisent : la houe, le cultivateur et les outils de terrain des mods n'ont que la caméra. Désactiver le mod rend ses touches et laisse le jeu tranquille - les pièces déjà courbées ou redimensionnées gardent leur forme."
hoo_help_master_note1_still: "Tourner, redimensionner, courber, décaler et zooper ne fonctionnent qu'à l'arrêt."
hoo_help_master_note2: "Le bandeau dans le coin montre les touches qui font quelque chose maintenant, et change quand tu maintiens un modificateur, une copie ou une sélection. Les messages s'affichent dans le panneau du mod et restent assez longtemps pour être lus. Pendant qu'un de tes bâtiments monte, un panneau liste ce qu'il lui faut encore. Les trois se déplacent et se redimensionnent dans la config : Key Hints, Messages, Building Panel."
hoo_help_rotating: "Tourner les pièces"
hoo_help_rot_turn: "Tourner la pièce à plat sur l'horizon"
hoo_help_rot_pitch: "Tangage : la basculer en avant et en arrière"
hoo_help_rot_roll: "Roulis : l'incliner à gauche et à droite"
hoo_help_rot_yaw_aim: "Lacet selon la visée : pousser le long de la ligne de placement"
hoo_help_rot_reset_axis: "Réinitialiser seulement l'axe maintenu"
hoo_help_rot_reset_all: "Réinitialiser tous les axes de rotation d'un coup"
hoo_help_rot_finer: "Crans de rotation plus fins (plus de divisions)"
hoo_help_rot_coarser: "Crans de rotation plus grossiers (moins de divisions)"
hoo_help_rot_note: "Réglé actuellement sur $1 crans par tour complet ($2° par clic)."
hoo_help_scaling: "Redimensionnement précis"
hoo_help_scale_hold: "Maintiens ce modificateur en utilisant les touches d'échelle ci-dessous"
hoo_help_scale_wider: "Plus large"
hoo_help_scale_narrower: "Plus étroit"
hoo_help_scale_taller: "Plus haut"
hoo_help_scale_shorter: "Plus bas"
hoo_help_scale_deeper: "Plus profond"
hoo_help_scale_shallower: "Moins profond"
hoo_help_scale_bigger: "Plus grand (uniforme)"
hoo_help_scale_smaller: "Plus petit (uniforme)"
hoo_help_scale_reset: "Remettre la pièce à sa taille par défaut 1,0x"
hoo_help_scale_note_all: "Toutes les pièces peuvent être redimensionnées, établis et navires compris."
hoo_help_scale_note_stations: "Les établis et stations de production gardent leur taille normale."
hoo_help_scale_note_usable: "Tout ce qu'on peut utiliser garde sa taille normale."
hoo_help_scale_note_range: "Plage d'échelle : $1x à $2x par pas de $3. Les pièces redimensionnées persistent au rechargement du monde et sont synchronisées avec tous les joueurs."
hoo_help_bending: "Courber les poutres"
hoo_help_bend_curve: "Courber la pièce en continu dans les deux sens"
hoo_help_bend_swap: "Changer l'axe de courbure"
hoo_help_bend_straighten: "Redresser la pièce"
hoo_help_bend_note: "Tant que $1 est maintenu, le gizmo éclaire l'anneau autour duquel tourne la courbure, et un message indique où iront les extrémités - haut, bas, gauche, droite, vers toi ou loin de toi. Les pièces se courbent selon leur plus grand côté, jusqu'à $2° (180° font d'une poutre droite un arc en demi-cercle). Seules les pièces structurelles pleines se courbent ; le menu de construction les marque d'un petit arc."
hoo_help_placing: "Placement libre & décalage"
hoo_help_place_free: "Placement libre : désactiver la collision / l'accroche aux surfaces"
hoo_help_place_surface: "Placement sur surface : plaquer contre la surface visée"
hoo_help_place_freeze: "Figer le fantôme de placement : le fixer en l'air pour l'inspecter sous tous les angles"
hoo_help_place_grid: "Activer l'accroche à la grille du monde ($1 m)"
hoo_help_place_clipping: "Autoriser les pièces à se chevaucher"
hoo_help_nudge_depth: "Décalage en profondeur : avant et arrière"
hoo_help_nudge_horizontal: "Décalage horizontal : gauche et droite"
hoo_help_nudge_vertical: "Décalage vertical : haut et bas"
hoo_help_nudge_large: "Maintenir pour des décalages plus grands"
hoo_help_nudge_reset: "Remettre tous les décalages à zéro"
hoo_help_nudge_note: "Pas de décalage : $1 m (fin), ou $2 m (grand, maintenu). Un appui déplace d'un pas ; maintiens une touche de décalage, d'échelle ou d'écart de zoop et elle se répète après un instant."
hoo_help_free_note: "Le placement libre ignore : $1"
hoo_help_free_note_workbench: "Aucun établi n'est nécessaire tant qu'il est actif."
hoo_help_free_note_ward: "La zone protégée d'un autre est toujours respectée."
hoo_help_freedom_vanilla: "aucune règle - il ne change que l'accroche."
hoo_help_freedom_surfaces: "ce sur quoi une pièce peut reposer."
hoo_help_freedom_spacing: "ce sur quoi une pièce peut reposer, et la place qu'il lui faut."
hoo_help_freedom_everything: "les règles de surface, d'espace, de biome, de donjon et de météo."
hoo_help_freedom_unrestricted: "toutes les règles, zones interdites et personnages gênants compris."
hoo_help_snapping: "Points d'accroche & modification sur place"
hoo_help_snap_cycle: "Parcourir les ancrages dérivés au centre, aux faces et aux arêtes"
hoo_help_snap_edit: "Modification sur place : reprendre une pièce construite pour la redimensionner/tourner/repositionner"
hoo_help_snap_note: "Une pièce modifiée commence figée exactement où elle est, pour que les petits ajustements restent petits ; appuie sur $1 pour qu'elle suive ta visée pour un plus grand déplacement. Placer ou annuler la libère. La modification garde la santé et les matériaux de la pièce sans surcoût. Les conteneurs, panneaux et présentoirs qui contiennent quelque chose ne peuvent pas être modifiés seuls - sélectionne-les et déplace la sélection, qui garde leur contenu."
hoo_help_selecting: "Sélectionner plusieurs pièces"
hoo_help_sel_toggle: "Ajouter la pièce regardée, ou la retirer"
hoo_help_sel_grow: "Agrandir : ajouter tout ce qui touche"
hoo_help_sel_shrink: "Revenir d'un agrandissement"
hoo_help_sel_building: "Ajouter tout le bâtiment connecté"
hoo_help_sel_type: "Ajouter seulement les pièces connectées du type regardé"
hoo_help_sel_clear: "Effacer la sélection"
hoo_help_sel_note: "Les pièces sélectionnées brillent tant qu'un outil de construction est en main. Sélectionner ne retire jamais une pièce, même si le clic molette est le retrait du marteau. Une sélection contient jusqu'à $1 pièces et reste jusqu'à ce que tu l'effaces ou quittes le monde."
hoo_help_sel_note_count: "$1 sélectionnées en ce moment."
hoo_help_sel_note_none: "Rien de sélectionné en ce moment."
hoo_help_groups: "Déplacer, copier et démonter une sélection"
hoo_help_groups_move: "Déplacer toute la sélection sur place - les coffres gardent leur contenu"
hoo_help_groups_copy: "Copier la sélection, pour la construire ailleurs"
hoo_help_groups_takedown: "Démonter la sélection - matériaux rendus, annuler la remonte"
hoo_help_groups_save: "Les mains vides : enregistrer la sélection comme plan"
hoo_help_groups_note1: "Un groupe tenu se redimensionne uniformément avec les touches d'échelle uniforme, tourne et se décale comme une seule pièce. Les copies sont de nouvelles pièces : les coffres arrivent vides et les présentoirs nus, le texte des panneaux suit."
hoo_help_groups_note_unlearned_in: "Les plantes sont omises, et les pièces que tu n'as pas apprises sont incluses (réglé par le serveur)."
hoo_help_groups_note_unlearned_out: "Les plantes sont omises, tout comme les pièces que tu n'as pas apprises - elles sont listées."
hoo_help_groups_note2: "Aucun établi n'est nécessaire pour déplacer, copier ou démonter une sélection. Les pièces qui ne peuvent être déplacées ou démontées - zone protégée d'un autre, en cours d'utilisation - sont nommées et désélectionnées."
hoo_help_copying: "Copies & chantiers"
hoo_help_copy_place: "La placer : ce que tu peux payer arrive en volant, le plus bas d'abord. La copie reste en main pour être replacée"
hoo_help_copy_stop: "Sur un bâtiment encore en construction : l'arrêter où il en est"
hoo_help_copy_takedown: "Sur une pièce d'une copie : démonter toute la copie, même après un redémarrage"
hoo_help_copy_note1: "Une copie que tu ne peux pas payer entièrement attend en fantôme et continue toute seule à mesure que les matériaux arrivent - sur toi, dans un sac AdventureBackpacks, ou dans des coffres à portée avec AzuCraftyBoxes - tant que tu es à moins de $1 m. Elle est sauvegardée avec le monde, et les autres joueurs ayant le mod voient son fantôme. Le panneau de chantier liste ce qu'il lui faut encore."
hoo_help_copy_note2: "Annuler démonte une copie et rend les matériaux d'où ils venaient - les coffres qui les contiennent, ton sac, ton inventaire - et ce qui ne tient nulle part tombe à tes pieds. Cela marche même en tenant encore la copie, pour en poser plusieurs et les reprendre une à une."
hoo_help_models: "Maquettes"
hoo_help_model_toggle: "Une copie ou un plan en main : en faire une miniature"
hoo_help_model_size: "Maquette plus grande / plus petite"
hoo_help_model_raise: "La monter / descendre finement, un centimètre par appui"
hoo_help_model_place: "La poser sur le dessus d'une table ou d'un sol"
hoo_help_model_off: "Sur sa table : retirer la maquette"
hoo_help_model_note: "Une maquette est dessinée, pas construite : un seul objet sauvegardé quelle que soit la taille du bâtiment, pour une résine, plus un bois et une pierre si le bâtiment en utilise. Annuler la retire. Les maquettes à plus de $1 m ne sont pas dessinées."
hoo_help_blueprints: "Plans"
hoo_help_bp_book: "Le marteau en main : ouvrir le livre des plans"
hoo_help_bp_save: "Avec une sélection et les mains vides : l'enregistrer comme plan"
hoo_help_bp_preview: "Tourner / zoomer l'aperçu ; le bouton au-dessus garde cette vue comme image"
hoo_help_bp_note1: "Les plans sont des fichiers PlanBuild, rangés dans BepInEx/config/PlanBuild - les plans de PlanBuild, Infinity Hammer et BuildShare s'ouvrent tous ici, et PlanBuild et Infinity Hammer peuvent ouvrir les tiens. Les pièces redimensionnées gardent leur taille dans les trois ; les courbures s'affichent aussi dans Infinity Hammer, là où ce mod est installé. Une fois pris, un plan se tient et se place exactement comme une copie."
hoo_help_bp_note2: "Enregistrer par-dessus un plan demande d'abord et garde l'ancien en fichier .bak. Une sélection se souvient du plan sous lequel elle a été enregistrée ou dont elle vient. Les pièces de mods non installés ici, les tailles au-delà des limites du serveur et le terrassement (une option du livre) sont affichés avant de placer."
hoo_help_runs: "Rangées zoop & annulation instantanée"
hoo_help_runs_zoop: "Étendre une ligne ou une grille de copies (zoop) avant de placer"
hoo_help_runs_gap_wider: "Écart plus grand"
hoo_help_runs_gap_narrower: "Écart plus petit / chevauchement"
hoo_help_runs_undo: "Annuler : reprendre la dernière chose faite - une rangée, une copie, un déplacement, un démontage"
hoo_help_runs_redo: "Rétablir : refaire ce que tu viens d'annuler (les pièces reconstruites sont repayées)"
hoo_help_runs_gap_none: "aucun, elles se touchent"
hoo_help_runs_gap_metres: "$1 m"
hoo_help_runs_gap_overlap: "$1 m de chevauchement"
hoo_help_runs_note: "Écart entre les copies : $1, par pas de $2 m. $3 le réinitialise avec le zoop. Construit jusqu'à $4 copies d'affilée en un clic. Annuler retient les $5 dernières actions de placement,"
hoo_help_runs_note_refund: "en rendant les ressources directement dans ton inventaire."
hoo_help_runs_note_drop: "en lâchant les matériaux à l'emplacement des pièces."
hoo_help_camera: "Caméra de construction détachée"
hoo_help_cam_toggle: "Activer la caméra de construction en vol libre"
hoo_help_cam_fly: "Voler autour du chantier (W / A / S / D)"
hoo_help_cam_vertical: "Voler verticalement vers le haut et le bas"
hoo_help_cam_boost: "Vol rapide de la caméra"
hoo_help_cam_note: "Le personnage reste sur place pendant que le placement vise depuis la caméra volante. Portée de la laisse : $1 m du personnage."
hoo_help_cam_note_pickup: "La caméra ramasse les objets au sol en volant."
hoo_help_doors: "Portes"
hoo_help_doors_open: "Ouvrir la porte visée en tenant un outil de construction"
hoo_help_doors_note: "Portée : $1 m. Les portes seulement - coffres, établis et le reste restent fermés tant qu'un outil de construction est en main, pour que rien ne s'ouvre par accident en alignant une pièce."
hoo_help_stations: "Portée de l'établi & allonge étendue"
hoo_help_stations_radius: "Agrandir ou réduire le rayon de l'établi actif"
hoo_help_stations_note: "Plage réglable : $1 m à $2 m. Le rayon est conservé par établi."
hoo_help_stations_note_reach: "L'allonge de construction s'étend partout dans l'aura de l'établi (jusqu'à $1 m)."
hoo_more_kinds: "$1 autres types"
hoo_more_kinds_in_log: "$1 autres types, listés dans le journal"
