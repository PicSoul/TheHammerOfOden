hoo_help_nudge_vertical: "Nudge vertical: upward and downward"
hoo_help_nudge_large: "Hold for larger nudge increments"
hoo_help_nudge_reset: "Reset all nudging offsets back to zero"
hoo_help_nudge_note: "Nudge step size: $1m (fine), or $2m (large held). A tap moves one step; hold a nudge, scale or zoop-gap key and it repeats after a moment."
hoo_help_free_note: "Free placement sets aside: $1"
hoo_help_free_note_workbench: "No workbench is needed while it is on."
hoo_help_free_note_ward: "Someone else's ward is always respected."
hoo_help_freedom_vanilla: "no rules - it only changes snapping."
hoo_help_freedom_surfaces: "what a piece may rest on."
hoo_help_freedom_spacing: "what a piece may rest on, and the room it needs."
hoo_help_freedom_everything: "surface, spacing, biome, dungeon and weather rules."
hoo_help_freedom_unrestricted: "every rule, no-build zones and characters in the way included."
hoo_help_snapping: "Snap Points & In-Place Editing"
hoo_help_snap_cycle: "Cycle derived center, face, and edge snap anchors"
hoo_help_snap_edit: "In-place edit: pick up already-built piece to resize/rotate/reposition"
hoo_help_snap_note: "An edited piece starts frozen exactly where it stands, so small adjustments stay small; press $1 to let it follow your aim for a bigger move. Placing or cancelling releases it. Editing keeps the piece's health and materials at no extra cost. Containers, signs and item stands with something in them cannot be edited on their own - select them and move the selection instead, which keeps what they hold."
hoo_help_selecting: "Selecting Several Pieces"
hoo_help_sel_toggle: "Add the piece you are looking at, or take it out"
hoo_help_sel_grow: "Grow: add everything touching"
hoo_help_sel_shrink: "Shrink back one grow"
hoo_help_sel_building: "Add the whole connected building"
hoo_help_sel_type: "Add only connected pieces of the kind you are looking at"
hoo_help_sel_clear: "Clear the selection"
hoo_help_sel_note: "Selected pieces glow while a building tool is in hand. Selecting never removes a piece, even though middle-click is the hammer's remove. A selection holds up to $1 pieces and is kept until you clear it or leave the world."
hoo_help_sel_note_count: "$1 selected right now."
hoo_help_sel_note_none: "Nothing selected right now."
hoo_help_groups: "Moving, Copying & Taking Down a Selection"
hoo_help_groups_move: "Move the whole selection in place - chests keep what is in them"
hoo_help_groups_copy: "Copy the selection, to build somewhere else"
hoo_help_groups_takedown: "Take the selection down - materials back, undo puts it back up"
hoo_help_groups_save: "With nothing held: save the selection as a blueprint"
hoo_help_groups_note1: "A held group resizes evenly with the uniform scale keys, turns and nudges like one piece. Copies are new pieces: chests come empty and item stands bare, sign text comes along."
hoo_help_groups_note_unlearned_in: "Plants are left out, and pieces you have not learned are included (set by the server)."
hoo_help_groups_note_unlearned_out: "Plants are left out, and so are pieces you have not learned - they are listed."
hoo_help_groups_note2: "No crafting station is needed to move, copy or take down a selection. Pieces that cannot be moved or taken down - someone else's ward, in use - are named and deselected."
hoo_help_copying: "Copies & Construction Sites"
hoo_help_copy_place: "Place it: what you can pay for flies in, lowest first. The copy stays in hand to place again"
hoo_help_copy_stop: "On a building still going up: stop it where it stands"
hoo_help_copy_takedown: "On any piece of a copy: take the whole copy down, even after a restart"
hoo_help_copy_note1: "A copy you cannot pay for in full waits as a ghost and carries on by itself as materials turn up - on you, in an AdventureBackpacks backpack, or in chests within reach with AzuCraftyBoxes - while you are within $1m. It is saved with the world, and other players with the mod see its ghost. The building panel lists what it still needs."
hoo_help_copy_note2: "Undo takes a copy down and hands the materials back where they came from - chests that hold them, your backpack, your inventory - and anything that fits nowhere lands at your feet. It works while you still hold the copy, so you can put down several and take them back one by one."
hoo_help_models: "Models"
hoo_help_model_toggle: "Holding a copy or a blueprint: turn it into a miniature"
hoo_help_model_size: "Bigger / smaller model"
hoo_help_model_raise: "Raise / lower it finely, a centimetre a press"
hoo_help_model_place: "Stand it on the top of a table or a floor"
hoo_help_model_off: "On its table: take the model off"
hoo_help_model_note: "A model is drawn, not built: one saved object however large the building, costing one resin, plus one wood and one stone if the building uses them. Undo takes it off again. Models further than $1m away are not drawn."
hoo_help_blueprints: "Blueprints"
hoo_help_bp_book: "With the hammer out: open the blueprint book"
hoo_help_bp_save: "With a selection and nothing held: save it as a blueprint"
hoo_help_bp_preview: "Turn / zoom the model preview; the button above keeps that view as its picture"
hoo_help_bp_note1: "Blueprints are PlanBuild files, kept in BepInEx/config/PlanBuild - PlanBuild, Infinity Hammer and BuildShare blueprints all open here, and PlanBuild and Infinity Hammer can open yours. Scaled pieces keep their size in all three; bends show in Infinity Hammer too, where this mod is installed. Picked up, a blueprint is held and placed exactly like a copy."
hoo_help_bp_note2: "Saving over a blueprint asks first and keeps the old one as a .bak file. A selection remembers the blueprint it was saved as or built from. Pieces from mods not installed here, sizes beyond the server's limits and ground shaping (an option in the book) are shown before you place."
hoo_help_runs: "Zooping Runs & Instant Undo"
hoo_help_runs_zoop: "Extend a line or grid of copies (zooping) before placing"
hoo_help_runs_gap_wider: "Wider gap"
hoo_help_runs_gap_narrower: "Narrower gap / overlap"
hoo_help_runs_undo: "Undo: take back the last thing you did - a run, a copy, a move, a take-down"
hoo_help_runs_redo: "Redo: do again what you last undid (rebuilt pieces are paid for again)"
hoo_help_runs_gap_none: "none, they touch"
hoo_help_runs_gap_metres: "$1m"
hoo_help_runs_gap_overlap: "$1m overlap"
hoo_help_runs_note: "Gap between copies: $1, in $2m steps. $3 clears it with the zoop. Builds up to $4 continuous copies in a single click. Undo remembers the last $5 placement actions,"
hoo_help_runs_note_refund: "refunding resources directly into your inventory."
hoo_help_runs_note_drop: "dropping materials at piece locations."
hoo_help_camera: "Detached Build Camera"
hoo_help_cam_toggle: "Toggle detached free-flight build camera"
hoo_help_cam_fly: "Fly around build site (W / A / S / D)"
hoo_help_cam_vertical: "Fly vertically up and down"
hoo_help_cam_boost: "High-speed camera boost flight"
hoo_help_cam_note: "Character remains anchored while placement aims from the flying camera. Tether range: $1m from character."
hoo_help_cam_note_pickup: "The camera picks up loose items as it flies."
hoo_help_doors: "Doors"
hoo_help_doors_open: "Open targeted door while holding building tool"
hoo_help_doors_note: "Reach: $1m. Doors only - chests, stations and everything else stay shut off while a build tool is in hand, so nothing opens by accident as you line up a piece."
hoo_help_stations: "Workbench Range & Extended Reach"
hoo_help_stations_radius: "Expand or contract active workbench radius"
hoo_help_stations_note: "Configurable range: $1m to $2m. Radius persists per station."
hoo_help_stations_note_reach: "Build reach extends anywhere inside the workbench aura (up to $1m)."
hoo_more_kinds: "$1 more kinds"
hoo_more_kinds_in_log: "$1 more kinds, listed in the log"
