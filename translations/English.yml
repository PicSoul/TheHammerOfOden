hoo_help_master_toggle: "Turn the whole mod on or off"
hoo_help_master_note1: "The hammer glows and emits subtle embers while active. Everything except the build camera is limited to tools that build, so the hoe, the cultivator and modded terrain tools get the camera and nothing else. Turning the mod off hands back its keys and leaves the game alone - pieces you have already bent or scaled keep their shape."
hoo_help_master_note1_still: "Rotating, scaling, bending, nudging and zooping only work while you stand still."
hoo_help_master_note2: "The strip in the corner shows the keys that do something right now, and changes as you hold a modifier, a copy or a selection. Messages appear in the mod's own panel and stay long enough to read. While a building of yours is going up, a panel lists what it still needs. All three move and resize in the config: Key Hints, Messages, Building Panel."
