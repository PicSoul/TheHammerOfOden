hoo_help_key_lmb_holding_copy: "Botão esquerdo, segurando uma cópia"
hoo_help_key_lmb: "Botão esquerdo"
hoo_help_key_mmb_twice_or: "Botão do meio duas vezes, ou $1"
hoo_help_key_drag_scroll_preview: "Arrastar / roda na prévia"
hoo_help_key_hold_arrows: "Segurar $1 + setas"
hoo_help_key_movement: "Teclas de movimento"
hoo_help_key_use: "Sua tecla de usar"
hoo_help_master: "O interruptor geral"
hoo_help_master_toggle: "Ligar ou desligar o mod inteiro"
hoo_help_master_note1: "O martelo brilha e solta faíscas sutis enquanto está ativo. Tudo exceto a câmera de construção se limita às ferramentas que constroem, então a enxada, o cultivador e as ferramentas de terreno de outros mods só ganham a câmera. Desligar o mod devolve as teclas e deixa o jogo em paz - peças que você já curvou ou escalou mantêm a forma."
hoo_help_master_note1_still: "Girar, escalar, curvar, deslocar e fazer zoop só funcionam enquanto você está parado."
hoo_help_master_note2: "A faixa no canto mostra as teclas que fazem algo agora, e muda quando você segura um modificador, uma cópia ou uma seleção. As mensagens aparecem no painel próprio do mod e ficam tempo suficiente para serem lidas. Enquanto uma construção sua está subindo, um painel mostra o que ainda falta. Os três podem ser movidos e redimensionados na configuração: Key Hints, Messages, Building Panel."
hoo_help_rotating: "Girar peças"
hoo_help_rot_turn: "Girar a peça no plano horizontal"
hoo_help_rot_pitch: "Arfagem: inclinar para frente e para trás"
hoo_help_rot_roll: "Rolagem: inclinar para a esquerda e para a direita"
hoo_help_rot_yaw_aim: "Guinada pela mira: empurrar ao longo da linha de posicionamento"
hoo_help_rot_reset_axis: "Zerar só o eixo que você está segurando"
hoo_help_rot_reset_all: "Zerar todos os eixos de rotação de uma vez"
hoo_help_rot_finer: "Passos de rotação mais finos (mais divisões)"
hoo_help_rot_coarser: "Passos de rotação mais grossos (menos divisões)"
hoo_help_rot_note: "Configurado agora com $1 passos por volta completa ($2° por clique)."
hoo_help_scaling: "Escala de precisão"
hoo_help_scale_hold: "Segure este modificador ao usar as teclas de escala abaixo"
hoo_help_scale_wider: "Mais larga"
hoo_help_scale_narrower: "Mais estreita"
hoo_help_scale_taller: "Mais alta"
hoo_help_scale_shorter: "Mais baixa"
hoo_help_scale_deeper: "Mais funda"
hoo_help_scale_shallower: "Mais rasa"
hoo_help_scale_bigger: "Maior (uniforme)"
hoo_help_scale_smaller: "Menor (uniforme)"
hoo_help_scale_reset: "Voltar a peça ao tamanho padrão de 1.0x"
hoo_help_scale_note_all: "Qualquer peça pode ser redimensionada, inclusive estações e barcos."
hoo_help_scale_note_stations: "Estações de fabricação e produção mantêm o tamanho normal."
hoo_help_scale_note_usable: "Tudo o que pode ser usado mantém o tamanho normal."
hoo_help_scale_note_range: "Faixa de escala: $1x a $2x em passos de $3. Peças escaladas persistem ao recarregar o mundo e sincronizam com todos os jogadores."
hoo_help_bending: "Curvar e arquear vigas"
hoo_help_bend_curve: "Curvar a peça continuamente nos dois sentidos"
hoo_help_bend_swap: "Trocar o eixo da curva"
hoo_help_bend_straighten: "Endireitar a peça de volta"
hoo_help_bend_note: "Enquanto $1 está pressionado, o indicador acende o anel em torno do qual a curva gira, e uma mensagem diz para onde as pontas vão curvar - para cima, para baixo, esquerda, direita, na sua direção ou para longe. As peças curvam ao longo do lado mais comprido, até $2° (180° transformam uma viga reta num arco semicircular). Só peças estruturais sólidas curvam; o menu de construção as marca com um pequeno arco."
hoo_help_placing: "Posicionamento livre e deslocamento"
hoo_help_place_free: "Posicionamento livre: sem colisão / sem prender à superfície"
hoo_help_place_surface: "Posicionamento em superfície: alinhar rente à superfície que você mira"
hoo_help_place_freeze: "Travar o fantasma: prendê-lo no ar para ver de todos os ângulos"
hoo_help_place_grid: "Ligar/desligar o encaixe na grade do mundo ($1m)"
hoo_help_place_clipping: "Permitir que peças se sobreponham"
hoo_help_nudge_depth: "Deslocar em profundidade: para frente e para trás"
hoo_help_nudge_horizontal: "Deslocar na horizontal: esquerda e direita"
hoo_help_nudge_vertical: "Deslocar na vertical: para cima e para baixo"
hoo_help_nudge_large: "Segurar para passos de deslocamento maiores"
hoo_help_nudge_reset: "Zerar todos os deslocamentos"
hoo_help_nudge_note: "Passo de deslocamento: $1m (fino), ou $2m (segurando a tecla de passo grande). Um toque move um passo; segure uma tecla de deslocamento, escala ou espaçamento de zoop e ela repete após um instante."
hoo_help_free_note: "O posicionamento livre ignora: $1"
hoo_help_free_note_workbench: "Nenhuma bancada é necessária enquanto está ligado."
hoo_help_free_note_ward: "A proteção de outra pessoa é sempre respeitada."
hoo_help_freedom_vanilla: "nenhuma regra - só muda o encaixe."
hoo_help_freedom_surfaces: "onde uma peça pode se apoiar."
hoo_help_freedom_spacing: "onde uma peça pode se apoiar, e o espaço de que precisa."
hoo_help_freedom_everything: "regras de superfície, espaço, bioma, masmorra e clima."
hoo_help_freedom_unrestricted: "todas as regras, incluindo zonas sem construção e personagens no caminho."
hoo_help_snapping: "Pontos de encaixe e edição no lugar"
hoo_help_snap_cycle: "Alternar as âncoras de encaixe derivadas: centro, face e aresta"
hoo_help_snap_edit: "Edição no lugar: pegar uma peça já construída para redimensionar, girar ou reposicionar"
hoo_help_snap_note: "Uma peça editada começa travada exatamente onde está, então pequenos ajustes continuam pequenos; pressione $1 para ela seguir sua mira num movimento maior. Posicionar ou cancelar a solta. Editar mantém a vida e os materiais da peça sem custo extra. Contêineres, placas e suportes de itens com algo dentro não podem ser editados sozinhos - selecione-os e mova a seleção, o que mantém o que eles guardam."
hoo_help_selecting: "Selecionar várias peças"
hoo_help_sel_toggle: "Adicionar a peça para a qual você olha, ou tirá-la"
hoo_help_sel_grow: "Ampliar: adicionar tudo o que toca"
hoo_help_sel_shrink: "Desfazer uma ampliação"
hoo_help_sel_building: "Adicionar a construção conectada inteira"
hoo_help_sel_type: "Adicionar só as peças conectadas do tipo que você olha"
hoo_help_sel_clear: "Limpar a seleção"
hoo_help_sel_note: "Peças selecionadas brilham enquanto uma ferramenta de construção está na mão. Selecionar nunca remove uma peça, mesmo que o clique do meio seja o remover do martelo. Uma seleção guarda até $1 peças e é mantida até você limpá-la ou sair do mundo."
hoo_help_sel_note_count: "$1 selecionadas agora."
hoo_help_sel_note_none: "Nada selecionado agora."
hoo_help_groups: "Mover, copiar e desmontar uma seleção"
hoo_help_groups_move: "Mover a seleção inteira no lugar - baús mantêm o conteúdo"
hoo_help_groups_copy: "Copiar a seleção, para construir em outro lugar"
hoo_help_groups_takedown: "Desmontar a seleção - materiais de volta, desfazer levanta de novo"
hoo_help_groups_save: "Sem nada na mão: salvar a seleção como planta"
hoo_help_groups_note1: "Um grupo segurado é redimensionado por igual com as teclas de escala uniforme, e gira e desloca como uma peça só. Cópias são peças novas: baús vêm vazios e suportes sem itens, o texto das placas vem junto."
hoo_help_groups_note_unlearned_in: "Plantas ficam de fora, e peças que você não aprendeu são incluídas (definido pelo servidor)."
hoo_help_groups_note_unlearned_out: "Plantas ficam de fora, assim como peças que você não aprendeu - elas são listadas."
hoo_help_groups_note2: "Nenhuma estação de trabalho é necessária para mover, copiar ou desmontar uma seleção. Peças que não podem ser movidas ou desmontadas - proteção de outra pessoa, em uso - são nomeadas e desmarcadas."
hoo_help_copying: "Cópias e obras"
hoo_help_copy_place: "Posicionar: o que você pode pagar chega voando, de baixo para cima. A cópia continua na mão para posicionar de novo"
hoo_help_copy_stop: "Numa construção ainda subindo: pará-la onde está"
hoo_help_copy_takedown: "Em qualquer peça de uma cópia: desmontar a cópia inteira, mesmo após reiniciar"
hoo_help_copy_note1: "Uma cópia que você não pode pagar por inteiro espera como fantasma e continua sozinha conforme os materiais aparecem - com você, numa mochila do AdventureBackpacks, ou em baús ao alcance com AzuCraftyBoxes - enquanto você estiver a menos de $1m. Ela é salva com o mundo, e outros jogadores com o mod veem seu fantasma. O painel da obra mostra o que ainda falta."
hoo_help_copy_note2: "Desfazer desmonta uma cópia e devolve os materiais de onde vieram - baús que os guardam, sua mochila, seu inventário - e o que não couber em lugar nenhum cai aos seus pés. Funciona enquanto você ainda segura a cópia, então dá para pôr várias e tirá-las uma a uma."
hoo_help_models: "Maquetes"
hoo_help_model_toggle: "Segurando uma cópia ou planta: transformar em miniatura"
hoo_help_model_size: "Maquete maior / menor"
hoo_help_model_raise: "Subir / descer com precisão, um centímetro por toque"
hoo_help_model_place: "Pôr no tampo de uma mesa ou num piso"
hoo_help_model_off: "Na mesa dela: remover a maquete"
hoo_help_model_note: "Uma maquete é desenhada, não construída: um único objeto salvo, por maior que seja a construção, custando uma resina, mais uma madeira e uma pedra se a construção as usa. Desfazer a remove de novo. Maquetes a mais de $1m não são desenhadas."
hoo_help_blueprints: "Plantas"
hoo_help_bp_book: "Com o martelo na mão: abrir o livro de plantas"
hoo_help_bp_save: "Com uma seleção e nada na mão: salvá-la como planta"
hoo_help_bp_preview: "Girar / dar zoom na prévia da maquete; o botão acima guarda essa vista como imagem"
hoo_help_bp_note1: "Plantas são arquivos do PlanBuild, guardados em BepInEx/config/PlanBuild - plantas do PlanBuild, Infinity Hammer e BuildShare abrem aqui, e PlanBuild e Infinity Hammer podem abrir as suas. Peças escaladas mantêm o tamanho nos três; curvas também aparecem no Infinity Hammer, onde este mod está instalado. Ao pegá-la, uma planta é segurada e posicionada igual a uma cópia."
hoo_help_bp_note2: "Salvar por cima de uma planta pergunta antes e mantém a antiga como arquivo .bak. Uma seleção lembra a planta com que foi salva ou da qual foi construída. Peças de mods não instalados aqui, tamanhos além dos limites do servidor e modelagem do terreno (uma opção do livro) são mostrados antes de posicionar."
hoo_help_runs: "Fileiras de zoop e desfazer instantâneo"
hoo_help_runs_zoop: "Estender uma linha ou grade de cópias (zoop) antes de posicionar"
hoo_help_runs_gap_wider: "Espaçamento maior"
hoo_help_runs_gap_narrower: "Espaçamento menor / sobreposição"
hoo_help_runs_undo: "Desfazer: desfazer a última coisa que você fez - uma fileira, uma cópia, um movimento, uma desmontagem"
hoo_help_runs_redo: "Refazer: fazer de novo o último desfeito (peças reconstruídas são pagas de novo)"
hoo_help_runs_gap_none: "nenhum, elas se tocam"
hoo_help_runs_gap_metres: "$1m"
hoo_help_runs_gap_overlap: "$1m de sobreposição"
hoo_help_runs_note: "Espaçamento entre cópias: $1, em passos de $2m. $3 o zera junto com o zoop. Constrói até $4 cópias seguidas num único clique. Desfazer lembra as últimas $5 ações de posicionamento,"
hoo_help_runs_note_refund: "devolvendo os recursos direto ao seu inventário."
hoo_help_runs_note_drop: "largando os materiais onde as peças estavam."
hoo_help_camera: "Câmera de construção solta"
hoo_help_cam_toggle: "Ligar/desligar a câmera de construção de voo livre"
hoo_help_cam_fly: "Voar pela obra (W / A / S / D)"
hoo_help_cam_vertical: "Voar na vertical para cima e para baixo"
hoo_help_cam_boost: "Voo rápido da câmera"
hoo_help_cam_note: "O personagem fica parado enquanto o posicionamento mira a partir da câmera voadora. Alcance da câmera: $1m do personagem."
hoo_help_cam_note_pickup: "A câmera recolhe itens soltos enquanto voa."
hoo_help_doors: "Portas"
hoo_help_doors_open: "Abrir a porta mirada segurando uma ferramenta de construção"
hoo_help_doors_note: "Alcance: $1m. Só portas - baús, estações e todo o resto ficam bloqueados enquanto uma ferramenta de construção está na mão, para nada abrir sem querer enquanto você alinha uma peça."
hoo_help_stations: "Alcance da bancada e alcance ampliado"
hoo_help_stations_radius: "Aumentar ou diminuir o raio da bancada"
hoo_help_stations_note: "Raio configurável: $1m a $2m. O raio é salvo por estação."
hoo_help_stations_note_reach: "O alcance de construção vai a qualquer ponto dentro da aura da bancada (até $1m)."
hoo_more_kinds: "mais $1 tipos"
hoo_more_kinds_in_log: "mais $1 tipos, listados no log"
