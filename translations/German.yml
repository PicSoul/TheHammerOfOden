hoo_help_master: "Der Hauptschalter"
hoo_help_master_toggle: "Die ganze Mod ein- oder ausschalten"
hoo_help_master_note1: "Der Hammer glüht und versprüht im aktiven Zustand leichte Funken. Alles außer der Baukamera ist auf Werkzeuge beschränkt, die bauen, also bekommen die Hacke, der Kultivator und Gelände-Werkzeuge aus Mods nur die Kamera. Ausschalten gibt die Tasten zurück und lässt das Spiel in Ruhe - schon gebogene oder skalierte Bauteile behalten ihre Form."
hoo_help_master_note1_still: "Drehen, Skalieren, Biegen, Verschieben und Zoopen funktionieren nur im Stehen."
hoo_help_master_note2: "Die Leiste in der Ecke zeigt die Tasten, die gerade etwas tun, und ändert sich, wenn du einen Modifikator, eine Kopie oder eine Auswahl hältst. Meldungen erscheinen im eigenen Feld der Mod und bleiben lange genug zum Lesen. Während eines deiner Gebäude entsteht, listet ein Feld auf, was noch fehlt. Alle drei lassen sich in der Konfiguration verschieben und skalieren: Key Hints, Messages, Building Panel."
hoo_help_rotating: "Bauteile drehen"
hoo_help_rot_turn: "Das Bauteil flach in der Horizontalen drehen"
hoo_help_rot_pitch: "Neigen: nach vorn und hinten kippen"
hoo_help_rot_roll: "Rollen: nach links und rechts kippen"
hoo_help_rot_yaw_aim: "Gieren entlang des Blicks: entlang der Platzierungslinie schieben"
hoo_help_rot_reset_axis: "Nur die gerade gehaltene Achse zurücksetzen"
hoo_help_rot_reset_all: "Alle Drehachsen auf einmal zurücksetzen"
hoo_help_rot_finer: "Feinere Drehschritte (mehr Teilungen)"
hoo_help_rot_coarser: "Gröbere Drehschritte (weniger Teilungen)"
hoo_help_rot_note: "Aktuell eingestellt auf $1 Schritte pro voller Umdrehung ($2° pro Klick)."
hoo_help_scaling: "Präzises Skalieren"
hoo_help_scale_hold: "Diesen Modifikator halten, während du die Skalierungstasten unten nutzt"
hoo_help_scale_wider: "Breiter"
hoo_help_scale_narrower: "Schmaler"
hoo_help_scale_taller: "Höher"
hoo_help_scale_shorter: "Niedriger"
hoo_help_scale_deeper: "Tiefer"
hoo_help_scale_shallower: "Flacher"
hoo_help_scale_bigger: "Größer (gleichmäßig)"
hoo_help_scale_smaller: "Kleiner (gleichmäßig)"
hoo_help_scale_reset: "Bauteil auf die Standardgröße 1,0x zurücksetzen"
hoo_help_scale_note_all: "Jedes Bauteil kann skaliert werden, Stationen und Schiffe eingeschlossen."
hoo_help_scale_note_stations: "Handwerks- und Produktionsstationen behalten ihre normale Größe."
hoo_help_scale_note_usable: "Alles, was man benutzen kann, behält seine normale Größe."
hoo_help_scale_note_range: "Skalierungsbereich: $1x bis $2x in Schritten von $3. Skalierte Bauteile bleiben über Neuladen der Welt erhalten und werden mit allen Spielern synchronisiert."
hoo_help_bending: "Balken biegen und krümmen"
hoo_help_bend_curve: "Das Bauteil stufenlos in beide Richtungen krümmen"
hoo_help_bend_swap: "Biegeachse tauschen"
hoo_help_bend_straighten: "Bauteil wieder gerade machen"
hoo_help_bend_note: "Solange $1 gehalten wird, leuchtet am Gizmo der Ring auf, um den sich die Biegung dreht, und eine Meldung sagt, wohin sich die Enden krümmen - hoch, runter, links, rechts, zu dir hin oder von dir weg. Bauteile biegen sich entlang ihrer längsten Seite, bis zu $2° (180° machen aus einem geraden Balken einen Halbkreisbogen). Nur massive tragende Bauteile lassen sich biegen; das Baumenü markiert sie mit einem kleinen Bogen."
hoo_help_placing: "Freie Platzierung & Verschieben"
hoo_help_place_free: "Freie Platzierung: Kollision / Flächenbindung aufheben"
hoo_help_place_surface: "Flächenplatzierung: bündig an die anvisierte Fläche anlegen"
hoo_help_place_freeze: "Platzierungsgeist fixieren: in der Luft festhalten, um ihn von allen Seiten zu prüfen"
hoo_help_place_grid: "Weltraster-Einrasten umschalten ($1 m)"
hoo_help_place_clipping: "Überlappende Bauteile ineinander erlauben"
hoo_help_nudge_depth: "Tiefe verschieben: vor und zurück"
hoo_help_nudge_horizontal: "Waagerecht verschieben: links und rechts"
hoo_help_nudge_vertical: "Senkrecht verschieben: hoch und runter"
hoo_help_nudge_large: "Halten für größere Verschiebeschritte"
hoo_help_nudge_reset: "Alle Verschiebungen auf null zurücksetzen"
hoo_help_nudge_note: "Verschiebeschritt: $1 m (fein) oder $2 m (groß, gehalten). Ein Tippen bewegt um einen Schritt; halte eine Verschiebe-, Skalier- oder Zoop-Abstandstaste, und sie wiederholt sich nach einem Moment."
hoo_help_free_note: "Freie Platzierung setzt außer Kraft: $1"
hoo_help_free_note_workbench: "Solange sie an ist, wird keine Werkbank gebraucht."
hoo_help_free_note_ward: "Der Schutzbereich eines anderen wird immer respektiert."
hoo_help_freedom_vanilla: "keine Regeln - sie ändert nur das Einrasten."
hoo_help_freedom_surfaces: "worauf ein Bauteil stehen darf."
hoo_help_freedom_spacing: "worauf ein Bauteil stehen darf, und den Platz, den es braucht."
hoo_help_freedom_everything: "Regeln zu Fläche, Abstand, Biom, Dungeon und Wetter."
hoo_help_freedom_unrestricted: "jede Regel, Bauverbotszonen und Figuren im Weg eingeschlossen."
hoo_help_snapping: "Einrastpunkte & Bearbeiten an Ort und Stelle"
hoo_help_snap_cycle: "Abgeleitete Mittel-, Flächen- und Kanten-Ankerpunkte durchschalten"
hoo_help_snap_edit: "Bearbeiten an Ort und Stelle: gebautes Bauteil aufnehmen, um Größe/Drehung/Position zu ändern"
hoo_help_snap_note: "Ein bearbeitetes Bauteil beginnt fixiert genau dort, wo es steht, damit kleine Anpassungen klein bleiben; drücke $1, damit es deinem Blick für eine größere Bewegung folgt. Platzieren oder Abbrechen löst es. Bearbeiten behält Zustand und Materialien des Bauteils ohne Mehrkosten. Behälter, Schilder und Gegenstandsständer mit Inhalt lassen sich nicht einzeln bearbeiten - wähle sie aus und bewege die Auswahl, das behält ihren Inhalt."
hoo_help_selecting: "Mehrere Bauteile auswählen"
hoo_help_sel_toggle: "Das angeschaute Bauteil hinzufügen oder entfernen"
hoo_help_sel_grow: "Erweitern: alles Berührende hinzufügen"
hoo_help_sel_shrink: "Eine Erweiterung zurücknehmen"
hoo_help_sel_building: "Das ganze verbundene Gebäude hinzufügen"
hoo_help_sel_type: "Nur verbundene Bauteile der angeschauten Art hinzufügen"
hoo_help_sel_clear: "Auswahl aufheben"
hoo_help_sel_note: "Ausgewählte Bauteile leuchten, solange ein Bauwerkzeug in der Hand ist. Auswählen entfernt nie ein Bauteil, auch wenn die mittlere Maustaste das Entfernen des Hammers ist. Eine Auswahl fasst bis zu $1 Bauteile und bleibt, bis du sie aufhebst oder die Welt verlässt."
hoo_help_sel_note_count: "$1 gerade ausgewählt."
hoo_help_sel_note_none: "Gerade nichts ausgewählt."
hoo_help_groups: "Eine Auswahl bewegen, kopieren und abbauen"
hoo_help_groups_move: "Die ganze Auswahl an Ort und Stelle bewegen - Truhen behalten ihren Inhalt"
hoo_help_groups_copy: "Die Auswahl kopieren, um sie woanders zu bauen"
hoo_help_groups_takedown: "Die Auswahl abbauen - Materialien zurück, Rückgängig baut sie wieder auf"
hoo_help_groups_save: "Mit leerer Hand: die Auswahl als Bauplan speichern"
hoo_help_groups_note1: "Eine gehaltene Gruppe skaliert gleichmäßig mit den Tasten für gleichmäßiges Skalieren, dreht sich und verschiebt sich wie ein Bauteil. Kopien sind neue Bauteile: Truhen kommen leer und Gegenstandsständer leer, Schildtext kommt mit."
hoo_help_groups_note_unlearned_in: "Pflanzen werden ausgelassen, und Bauteile, die du nicht gelernt hast, sind enthalten (vom Server eingestellt)."
hoo_help_groups_note_unlearned_out: "Pflanzen werden ausgelassen, ebenso Bauteile, die du nicht gelernt hast - sie werden aufgelistet."
hoo_help_groups_note2: "Zum Bewegen, Kopieren oder Abbauen einer Auswahl wird keine Werkstation gebraucht. Bauteile, die nicht bewegt oder abgebaut werden können - im Schutzbereich eines anderen, in Benutzung - werden genannt und abgewählt."
hoo_help_copying: "Kopien & Baustellen"
hoo_help_copy_place: "Platzieren: was du bezahlen kannst, fliegt herbei, das Unterste zuerst. Die Kopie bleibt zum erneuten Platzieren in der Hand"
hoo_help_copy_stop: "Auf einem Gebäude im Bau: dort anhalten, wo es steht"
hoo_help_copy_takedown: "Auf einem Bauteil einer Kopie: die ganze Kopie abbauen, auch nach einem Neustart"
hoo_help_copy_note1: "Eine Kopie, die du nicht voll bezahlen kannst, wartet als Geisterbild und baut von selbst weiter, sobald Materialien auftauchen - bei dir, in einem AdventureBackpacks-Rucksack oder mit AzuCraftyBoxes in Truhen in Reichweite - solange du innerhalb von $1 m bist. Sie wird mit der Welt gespeichert, und andere Spieler mit der Mod sehen ihr Geisterbild. Das Baufeld listet auf, was noch fehlt."
hoo_help_copy_note2: "Rückgängig baut eine Kopie ab und gibt die Materialien dorthin zurück, woher sie kamen - Truhen, die sie enthalten, dein Rucksack, dein Inventar - und was nirgends hinpasst, landet zu deinen Füßen. Es funktioniert, während du die Kopie noch hältst, sodass du mehrere absetzen und einzeln zurücknehmen kannst."
hoo_help_models: "Modelle"
hoo_help_model_toggle: "Mit einer Kopie oder einem Bauplan in der Hand: ein Miniaturmodell daraus machen"
hoo_help_model_size: "Modell größer / kleiner"
hoo_help_model_raise: "Fein anheben / absenken, ein Zentimeter pro Druck"
hoo_help_model_place: "Auf die Oberseite eines Tisches oder Bodens stellen"
hoo_help_model_off: "Auf seinem Tisch: das Modell herunternehmen"
hoo_help_model_note: "Ein Modell wird gezeichnet, nicht gebaut: ein gespeichertes Objekt, egal wie groß das Gebäude ist, für ein Harz, dazu ein Holz und ein Stein, wenn das Gebäude sie verwendet. Rückgängig nimmt es wieder herunter. Modelle weiter als $1 m entfernt werden nicht gezeichnet."
hoo_help_blueprints: "Baupläne"
hoo_help_bp_book: "Mit dem Hammer in der Hand: das Bauplanbuch öffnen"
hoo_help_bp_save: "Mit einer Auswahl und leerer Hand: als Bauplan speichern"
hoo_help_bp_preview: "Modellvorschau drehen / zoomen; der Knopf darüber behält diese Ansicht als Bild"
hoo_help_bp_note1: "Baupläne sind PlanBuild-Dateien in BepInEx/config/PlanBuild - Baupläne von PlanBuild, Infinity Hammer und BuildShare öffnen sich alle hier, und PlanBuild und Infinity Hammer können deine öffnen. Skalierte Bauteile behalten ihre Größe in allen dreien; Biegungen zeigen sich auch in Infinity Hammer, wo diese Mod installiert ist. Aufgenommen wird ein Bauplan genau wie eine Kopie gehalten und platziert."
hoo_help_bp_note2: "Das Überschreiben eines Bauplans fragt erst nach und behält den alten als .bak-Datei. Eine Auswahl merkt sich den Bauplan, als der sie gespeichert oder aus dem sie gebaut wurde. Bauteile aus hier nicht installierten Mods, Größen über den Server-Limits und Geländeformung (eine Option im Buch) werden vor dem Platzieren angezeigt."
hoo_help_runs: "Zoop-Reihen & sofortiges Rückgängig"
hoo_help_runs_zoop: "Vor dem Platzieren eine Linie oder ein Raster aus Kopien ziehen (Zoopen)"
hoo_help_runs_gap_wider: "Größerer Abstand"
hoo_help_runs_gap_narrower: "Kleinerer Abstand / Überlappung"
hoo_help_runs_undo: "Rückgängig: das zuletzt Getane zurücknehmen - eine Reihe, eine Kopie, ein Bewegen, ein Abbau"
hoo_help_runs_redo: "Wiederholen: das zuletzt Rückgängiggemachte erneut tun (neu gebaute Bauteile werden erneut bezahlt)"
hoo_help_runs_gap_none: "keiner, sie berühren sich"
hoo_help_runs_gap_metres: "$1 m"
hoo_help_runs_gap_overlap: "$1 m Überlappung"
hoo_help_runs_note: "Abstand zwischen Kopien: $1, in Schritten von $2 m. $3 setzt ihn mit dem Zoop zurück. Baut bis zu $4 durchgehende Kopien mit einem Klick. Rückgängig merkt sich die letzten $5 Platzierungen,"
hoo_help_runs_note_refund: "und erstattet Ressourcen direkt in dein Inventar."
hoo_help_runs_note_drop: "und lässt Materialien an den Bauteilen fallen."
hoo_help_camera: "Abgekoppelte Baukamera"
hoo_help_cam_toggle: "Abgekoppelte, frei fliegende Baukamera umschalten"
hoo_help_cam_fly: "Um die Baustelle fliegen (W / A / S / D)"
hoo_help_cam_vertical: "Senkrecht hoch und runter fliegen"
hoo_help_cam_boost: "Schneller Kameraflug"
hoo_help_cam_note: "Die Figur bleibt verankert, während die Platzierung von der fliegenden Kamera aus zielt. Leinenreichweite: $1 m von der Figur."
hoo_help_cam_note_pickup: "Die Kamera sammelt im Flug lose Gegenstände auf."
hoo_help_doors: "Türen"
hoo_help_doors_open: "Anvisierte Tür mit Bauwerkzeug in der Hand öffnen"
hoo_help_doors_note: "Reichweite: $1 m. Nur Türen - Truhen, Stationen und alles andere bleiben gesperrt, solange ein Bauwerkzeug in der Hand ist, damit sich beim Ausrichten nichts aus Versehen öffnet."
hoo_help_stations: "Werkbankradius & erweiterte Reichweite"
hoo_help_stations_radius: "Radius der aktiven Werkbank vergrößern oder verkleinern"
hoo_help_stations_note: "Einstellbarer Bereich: $1 m bis $2 m. Der Radius bleibt pro Station gespeichert."
hoo_help_stations_note_reach: "Die Bau-Reichweite gilt überall innerhalb der Werkbank-Aura (bis zu $1 m)."
hoo_more_kinds: "$1 weitere Arten"
hoo_more_kinds_in_log: "$1 weitere Arten, im Log aufgelistet"
