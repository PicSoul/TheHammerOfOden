hoo_help_scale_note_stations: "Станции крафта и производства сохраняют обычный размер."
hoo_help_scale_note_usable: "Всё, чем можно пользоваться, сохраняет обычный размер."
hoo_help_scale_note_range: "Диапазон масштаба: от $1x до $2x с шагом $3. Масштабированные детали сохраняются после перезагрузки мира и синхронизируются у всех игроков."
hoo_help_bending: "Изгиб и скругление балок"
hoo_help_bend_curve: "Плавно изгибать деталь в обе стороны"
hoo_help_bend_swap: "Сменить ось изгиба"
hoo_help_bend_straighten: "Выпрямить деталь обратно"
hoo_help_bend_note: "Пока удерживается $1, указатель подсвечивает кольцо, вокруг которого идёт изгиб, а сообщение говорит, куда загнутся концы - вверх, вниз, влево, вправо, к вам или от вас. Детали гнутся вдоль самой длинной стороны, до $2° (180° превращают прямую балку в полукруглую арку). Гнутся только твёрдые конструкционные детали; меню строительства отмечает их маленькой аркой."
hoo_help_placing: "Свободная установка и сдвиг"
hoo_help_place_free: "Свободная установка: без коллизий / без привязки к поверхности"
hoo_help_place_surface: "Установка по поверхности: вплотную к поверхности под прицелом"
hoo_help_place_freeze: "Закрепить призрак установки: повесить в воздухе, чтобы осмотреть со всех сторон"
hoo_help_place_grid: "Вкл./выкл. привязку к сетке мира ($1м)"
hoo_help_place_clipping: "Разрешить деталям пересекаться"
hoo_help_nudge_depth: "Сдвиг по глубине: вперёд и назад"
hoo_help_nudge_horizontal: "Сдвиг по горизонтали: влево и вправо"
hoo_help_nudge_vertical: "Сдвиг по вертикали: вверх и вниз"
hoo_help_nudge_large: "Удерживать для крупного шага сдвига"
hoo_help_nudge_reset: "Сбросить все сдвиги в ноль"
hoo_help_nudge_note: "Шаг сдвига: $1м (точный) или $2м (с клавишей крупного шага). Нажатие сдвигает на один шаг; удерживайте клавишу сдвига, масштаба или зазора зупа, и через миг она начнёт повторяться."
hoo_help_free_note: "Свободная установка отменяет: $1"
hoo_help_free_note_workbench: "Пока она включена, верстак не нужен."
hoo_help_free_note_ward: "Чужой охранный знак всегда соблюдается."
hoo_help_freedom_vanilla: "никаких правил - меняется только привязка."
hoo_help_freedom_surfaces: "то, на что может опираться деталь."
hoo_help_freedom_spacing: "то, на что может опираться деталь, и нужное ей место."
hoo_help_freedom_everything: "правила поверхности, места, биома, подземелья и погоды."
hoo_help_freedom_unrestricted: "все правила, включая зоны без строительства и мешающих персонажей."
hoo_help_snapping: "Точки привязки и правка на месте"
hoo_help_snap_cycle: "Переключать точки привязки: центр, грань и ребро"
hoo_help_snap_edit: "Правка на месте: взять уже построенную деталь, чтобы изменить размер, повернуть или переставить"
hoo_help_snap_note: "Изменяемая деталь сначала закреплена ровно там, где стоит, так что мелкие поправки остаются мелкими; нажмите $1, чтобы она следовала за взглядом для большого перемещения. Установка или отмена освобождает её. Правка сохраняет прочность и материалы детали без доплаты. Контейнеры, таблички и подставки с чем-то внутри нельзя изменить по отдельности - выберите их и переместите выбор, тогда содержимое сохранится."
hoo_help_selecting: "Выбор нескольких деталей"
hoo_help_sel_toggle: "Добавить деталь под взглядом или убрать её"
hoo_help_sel_grow: "Расширить: добавить всё, что касается"
hoo_help_sel_shrink: "Отменить одно расширение"
hoo_help_sel_building: "Добавить всю связанную постройку"
hoo_help_sel_type: "Добавить только связанные детали того же типа"
hoo_help_sel_clear: "Очистить выбор"
hoo_help_sel_note: "Выбранные детали светятся, пока в руках строительный инструмент. Выбор никогда не убирает деталь, хотя средний щелчок у молота означает удаление. В выборе до $1 деталей, и он сохраняется, пока вы его не очистите или не покинете мир."
hoo_help_sel_note_count: "Сейчас выбрано: $1."
hoo_help_sel_note_none: "Сейчас ничего не выбрано."
hoo_help_groups: "Перемещение, копирование и разбор выбора"
hoo_help_groups_move: "Переместить весь выбор на месте - сундуки сохраняют содержимое"
hoo_help_groups_copy: "Скопировать выбор, чтобы построить в другом месте"
hoo_help_groups_takedown: "Разобрать выбор - материалы возвращаются, отмена строит всё снова"
hoo_help_groups_save: "С пустыми руками: сохранить выбор как чертёж"
hoo_help_groups_note1: "Группа в руках масштабируется равномерно клавишами равномерного масштаба, поворачивается и сдвигается как одна деталь. Копии - это новые детали: сундуки пустые, подставки без предметов, текст табличек переносится."
hoo_help_groups_note_unlearned_in: "Растения пропускаются, а неизученные детали включаются (задаёт сервер)."
hoo_help_groups_note_unlearned_out: "Растения пропускаются, как и неизученные детали - они перечисляются."
hoo_help_groups_note2: "Для перемещения, копирования или разбора выбора станция не нужна. Детали, которые нельзя переместить или разобрать - чужой охранный знак, используются - называются и снимаются с выбора."
hoo_help_copying: "Копии и стройки"
hoo_help_copy_place: "Поставить: то, за что можете заплатить, прилетает снизу вверх. Копия остаётся в руках, чтобы поставить снова"
hoo_help_copy_stop: "На строящейся постройке: остановить её на месте"
hoo_help_copy_takedown: "На любой детали копии: разобрать всю копию, даже после перезапуска"
hoo_help_copy_note1: "Копия, за которую нельзя заплатить полностью, ждёт призраком и продолжается сама по мере появления материалов - у вас, в рюкзаке AdventureBackpacks или в сундуках поблизости с AzuCraftyBoxes - пока вы в пределах $1м. Она сохраняется вместе с миром, и другие игроки с модом видят её призрак. Панель стройки показывает, чего ещё не хватает."
hoo_help_copy_note2: "Отмена разбирает копию и возвращает материалы туда, откуда они взяты - в сундуки, в рюкзак, в инвентарь - а то, что никуда не влезает, падает к ногам. Это работает, пока вы ещё держите копию, так что можно поставить несколько и убрать их по одной."
hoo_help_models: "Макеты"
hoo_help_model_toggle: "Держа копию или чертёж: превратить в миниатюру"
hoo_help_model_size: "Больше / меньше макет"
hoo_help_model_raise: "Точно поднять / опустить, на сантиметр за нажатие"
hoo_help_model_place: "Поставить на верх стола или пол"
hoo_help_model_off: "На его столе: снять макет"
hoo_help_model_note: "Макет рисуется, а не строится: один сохранённый объект, каким бы большим ни было здание, стоимостью одна смола, плюс одно дерево и один камень, если здание их использует. Отмена снова снимает его. Макеты дальше $1м не рисуются."
hoo_help_blueprints: "Чертежи"
hoo_help_bp_book: "С молотом в руках: открыть книгу чертежей"
hoo_help_bp_save: "С выбором и пустыми руками: сохранить его как чертёж"
hoo_help_bp_preview: "Вращать / масштабировать превью макета; кнопка выше сохраняет этот вид как его картинку"
hoo_help_bp_note1: "Чертежи - это файлы PlanBuild, хранящиеся в BepInEx/config/PlanBuild - здесь открываются чертежи PlanBuild, Infinity Hammer и BuildShare, а PlanBuild и Infinity Hammer могут открыть ваши. Масштабированные детали сохраняют размер во всех трёх; изгибы видны и в Infinity Hammer, если установлен этот мод. Взятый чертёж держится и ставится так же, как копия."
hoo_help_bp_note2: "Сохранение поверх чертежа сначала спрашивает и сохраняет старый как файл .bak. Выбор помнит чертёж, как который он был сохранён или из которого построен. Детали из модов, не установленных здесь, размеры за пределами сервера и изменение земли (опция в книге) показываются до установки."
hoo_help_runs: "Ряды зупа и мгновенная отмена"
hoo_help_runs_zoop: "Вытянуть линию или сетку копий (зуп) перед установкой"
hoo_help_runs_gap_wider: "Больше зазор"
hoo_help_runs_gap_narrower: "Меньше зазор / перекрытие"
hoo_help_runs_undo: "Отмена: вернуть последнее действие - ряд, копию, перемещение, разбор"
hoo_help_runs_redo: "Повтор: снова сделать последнее отменённое (восстановленные детали оплачиваются снова)"
hoo_help_runs_gap_none: "нет, касаются"
hoo_help_runs_gap_metres: "$1м"
hoo_help_runs_gap_overlap: "$1м перекрытия"
hoo_help_runs_note: "Зазор между копиями: $1, шагами по $2м. $3 сбрасывает его вместе с зупом. Строит до $4 копий подряд одним щелчком. Отмена помнит последние $5 действий установки,"
hoo_help_runs_note_refund: "возвращая ресурсы прямо в инвентарь."
hoo_help_runs_note_drop: "бросая материалы на месте деталей."
hoo_help_camera: "Отдельная строительная камера"
hoo_help_cam_toggle: "Вкл./выкл. свободно летающую строительную камеру"
hoo_help_cam_fly: "Летать над стройкой (W / A / S / D)"
hoo_help_cam_vertical: "Лететь вертикально вверх и вниз"
hoo_help_cam_boost: "Ускоренный полёт камеры"
hoo_help_cam_note: "Персонаж остаётся на месте, а установка целится из летающей камеры. Дальность привязи: $1м от персонажа."
hoo_help_cam_note_pickup: "Камера подбирает лежащие предметы в полёте."
hoo_help_doors: "Двери"
hoo_help_doors_open: "Открыть дверь под прицелом со строительным инструментом в руках"
hoo_help_doors_note: "Дальность: $1м. Только двери - сундуки, станции и всё прочее отключены, пока в руках строительный инструмент, чтобы ничего не открылось случайно, пока вы выравниваете деталь."
hoo_help_stations: "Радиус верстака и увеличенная досягаемость"
hoo_help_stations_radius: "Увеличить или уменьшить радиус верстака"
hoo_help_stations_note: "Настраиваемый радиус: от $1м до $2м. Радиус хранится для каждой станции."
hoo_help_stations_note_reach: "Досягаемость строительства распространяется на всю ауру верстака (до $1м)."
hoo_more_kinds: "ещё видов: $1"
hoo_more_kinds_in_log: "ещё видов: $1, список в журнале"
