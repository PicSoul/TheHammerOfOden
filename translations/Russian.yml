hoo_help_master: "Главный переключатель"
hoo_help_master_toggle: "Включить или выключить весь мод"
hoo_help_master_note1: "Пока мод активен, молот светится и тихо искрит. Всё, кроме строительной камеры, работает только с инструментами для строительства, так что мотыге, культиватору и инструментам ландшафта из других модов достаётся только камера. Выключение мода освобождает его клавиши и оставляет игру как есть - уже согнутые или масштабированные детали сохраняют форму."
hoo_help_master_note1_still: "Поворот, масштаб, изгиб, сдвиг и зуп работают, только пока вы стоите на месте."
hoo_help_master_note2: "Полоска в углу показывает клавиши, которые сейчас что-то делают, и меняется, когда вы держите модификатор, копию или выбор. Сообщения появляются в собственной панели мода и висят достаточно долго, чтобы их прочитать. Пока ваша постройка возводится, панель показывает, чего ей ещё не хватает. Все три перемещаются и меняют размер в настройках: Key Hints, Messages, Building Panel."
