hoo_help_master: "Główny przełącznik"
hoo_help_master_toggle: "Włącz lub wyłącz cały mod"
hoo_help_master_note1: "Gdy mod jest aktywny, młot świeci i delikatnie iskrzy. Wszystko poza kamerą budowania działa tylko z narzędziami do budowania, więc motyka, kultywator i narzędzia terenu z innych modów dostają tylko kamerę. Wyłączenie moda oddaje jego klawisze i zostawia grę w spokoju - już zgięte lub przeskalowane elementy zachowują kształt."
hoo_help_master_note1_still: "Obrót, skalowanie, zginanie, przesuwanie i zoop działają tylko, gdy stoisz w miejscu."
hoo_help_master_note2: "Pasek w rogu pokazuje klawisze, które teraz coś robią, i zmienia się, gdy trzymasz modyfikator, kopię lub zaznaczenie. Komunikaty pojawiają się we własnym panelu moda i są widoczne wystarczająco długo, by je przeczytać. Gdy twoja budowla powstaje, panel pokazuje, czego jej jeszcze brakuje. Wszystkie trzy można przesuwać i zmieniać im rozmiar w konfiguracji: Key Hints, Messages, Building Panel."
hoo_help_rotating: "Obracanie elementów"
hoo_help_rot_turn: "Obróć element w płaszczyźnie poziomej"
hoo_help_rot_pitch: "Pochylenie: przechyl w przód i w tył"
hoo_help_rot_roll: "Przechył: przechyl w lewo i w prawo"
hoo_help_rot_yaw_aim: "Odchylenie wg celownika: wzdłuż linii stawiania"
hoo_help_rot_reset_axis: "Wyzeruj tylko oś, którą trzymasz"
hoo_help_rot_reset_all: "Wyzeruj wszystkie osie obrotu naraz"
hoo_help_rot_finer: "Drobniejszy skok obrotu (więcej podziałek)"
hoo_help_rot_coarser: "Grubszy skok obrotu (mniej podziałek)"
hoo_help_rot_note: "Obecnie ustawiono $1 kroków na pełny obrót ($2° na kliknięcie)."
hoo_help_scaling: "Precyzyjne skalowanie"
hoo_help_scale_hold: "Przytrzymaj ten modyfikator, używając klawiszy skali poniżej"
hoo_help_scale_wider: "Szerszy"
hoo_help_scale_narrower: "Węższy"
hoo_help_scale_taller: "Wyższy"
hoo_help_scale_shorter: "Niższy"
hoo_help_scale_deeper: "Głębszy"
hoo_help_scale_shallower: "Płytszy"
hoo_help_scale_bigger: "Większy (równomiernie)"
hoo_help_scale_smaller: "Mniejszy (równomiernie)"
hoo_help_scale_reset: "Przywróć elementowi domyślny rozmiar 1.0x"
hoo_help_scale_note_all: "Każdy element można przeskalować, łącznie ze stacjami i statkami."
hoo_help_scale_note_stations: "Stacje rzemieślnicze i produkcyjne zachowują normalny rozmiar."
hoo_help_scale_note_usable: "Wszystko, czego można używać, zachowuje normalny rozmiar."
hoo_help_scale_note_range: "Zakres skali: od $1x do $2x co $3. Przeskalowane elementy przetrwają ponowne wczytanie świata i synchronizują się u wszystkich graczy."
hoo_help_bending: "Zginanie i wyginanie belek"
hoo_help_bend_curve: "Płynnie zginaj element w obie strony"
hoo_help_bend_swap: "Zmień oś zgięcia"
hoo_help_bend_straighten: "Wyprostuj element z powrotem"
hoo_help_bend_note: "Gdy trzymasz $1, wskaźnik podświetla pierścień, wokół którego idzie zgięcie, a komunikat mówi, w którą stronę zagną się końce - w górę, w dół, w lewo, w prawo, do ciebie lub od ciebie. Elementy zginają się wzdłuż najdłuższego boku, do $2° (180° zmienia prostą belkę w półokrągły łuk). Zginają się tylko solidne elementy konstrukcyjne; menu budowania oznacza je małym łukiem."
hoo_help_placing: "Swobodne stawianie i przesuwanie"
hoo_help_place_free: "Swobodne stawianie: bez kolizji / bez przyklejania do powierzchni"
hoo_help_place_surface: "Stawianie na powierzchni: równo przy powierzchni, w którą celujesz"
hoo_help_place_freeze: "Zablokuj ducha stawiania: zawieś w powietrzu, by obejrzeć ze wszystkich stron"
hoo_help_place_grid: "Włącz/wyłącz przyciąganie do siatki świata ($1m)"
hoo_help_place_clipping: "Pozwól elementom się przenikać"
hoo_help_nudge_depth: "Przesunięcie w głąb: w przód i w tył"
hoo_help_nudge_horizontal: "Przesunięcie poziome: w lewo i w prawo"
hoo_help_nudge_vertical: "Przesunięcie pionowe: w górę i w dół"
hoo_help_nudge_large: "Przytrzymaj, by przesuwać większymi krokami"
hoo_help_nudge_reset: "Wyzeruj wszystkie przesunięcia"
hoo_help_nudge_note: "Krok przesunięcia: $1m (drobny) lub $2m (z klawiszem dużego kroku). Stuknięcie przesuwa o jeden krok; przytrzymaj klawisz przesunięcia, skali lub odstępu zoopa, a po chwili zacznie się powtarzać."
hoo_help_free_note: "Swobodne stawianie pomija: $1"
hoo_help_free_note_workbench: "Gdy jest włączone, warsztat nie jest potrzebny."
hoo_help_free_note_ward: "Cudza strażnica jest zawsze respektowana."
hoo_help_freedom_vanilla: "żadnych zasad - zmienia tylko przyciąganie."
hoo_help_freedom_surfaces: "na czym element może się opierać."
hoo_help_freedom_spacing: "na czym element może się opierać i ile miejsca potrzebuje."
hoo_help_freedom_everything: "zasady powierzchni, odstępów, biomu, lochów i pogody."
hoo_help_freedom_unrestricted: "wszystkie zasady, łącznie ze strefami bez budowania i postaciami na drodze."
hoo_help_snapping: "Punkty zaczepienia i edycja na miejscu"
hoo_help_snap_cycle: "Przełączaj punkty zaczepienia: środek, ściana i krawędź"
hoo_help_snap_edit: "Edycja na miejscu: weź już postawiony element, by zmienić rozmiar, obrócić lub przestawić"
hoo_help_snap_note: "Edytowany element zaczyna zablokowany dokładnie tam, gdzie stoi, więc drobne poprawki pozostają drobne; naciśnij $1, by podążał za celownikiem przy większym ruchu. Postawienie lub anulowanie go zwalnia. Edycja zachowuje wytrzymałość i materiały elementu bez dodatkowych kosztów. Pojemników, tabliczek i stojaków z czymś w środku nie można edytować osobno - zaznacz je i przesuń zaznaczenie, co zachowa ich zawartość."
hoo_help_selecting: "Zaznaczanie wielu elementów"
hoo_help_sel_toggle: "Dodaj element, na który patrzysz, lub go usuń"
hoo_help_sel_grow: "Rozszerz: dodaj wszystko, co się styka"
hoo_help_sel_shrink: "Cofnij jedno rozszerzenie"
hoo_help_sel_building: "Dodaj całą połączoną budowlę"
hoo_help_sel_type: "Dodaj tylko połączone elementy rodzaju, na który patrzysz"
hoo_help_sel_clear: "Wyczyść zaznaczenie"
hoo_help_sel_note: "Zaznaczone elementy świecą, gdy trzymasz narzędzie do budowania. Zaznaczanie nigdy nie usuwa elementu, choć środkowy przycisk to usuwanie młotem. Zaznaczenie mieści do $1 elementów i zostaje, dopóki go nie wyczyścisz lub nie opuścisz świata."
hoo_help_sel_note_count: "Teraz zaznaczono: $1."
hoo_help_sel_note_none: "Teraz nic nie jest zaznaczone."
hoo_help_groups: "Przesuwanie, kopiowanie i rozbieranie zaznaczenia"
hoo_help_groups_move: "Przesuń całe zaznaczenie na miejscu - skrzynie zachowują zawartość"
hoo_help_groups_copy: "Skopiuj zaznaczenie, by zbudować je gdzie indziej"
hoo_help_groups_takedown: "Rozbierz zaznaczenie - materiały wracają, cofnięcie stawia je znowu"
hoo_help_groups_save: "Z pustymi rękami: zapisz zaznaczenie jako plan"
hoo_help_groups_note1: "Trzymana grupa skaluje się równomiernie klawiszami skali równomiernej, obraca się i przesuwa jak jeden element. Kopie to nowe elementy: skrzynie są puste, a stojaki bez przedmiotów, tekst tabliczek jest kopiowany."
hoo_help_groups_note_unlearned_in: "Rośliny są pomijane, a elementy, których nie znasz, są uwzględniane (ustawia serwer)."
hoo_help_groups_note_unlearned_out: "Rośliny są pomijane, podobnie jak elementy, których nie znasz - są wymienione."
hoo_help_groups_note2: "Do przesuwania, kopiowania czy rozbierania zaznaczenia nie trzeba stacji. Elementy, których nie można przesunąć ani rozebrać - cudza strażnica, w użyciu - są wymienione i odznaczone."
hoo_help_copying: "Kopie i budowy"
hoo_help_copy_place: "Postaw: to, za co możesz zapłacić, przylatuje od dołu. Kopia zostaje w ręce, by postawić ją znowu"
hoo_help_copy_stop: "Na wciąż powstającej budowli: zatrzymaj ją w miejscu"
hoo_help_copy_takedown: "Na dowolnym elemencie kopii: rozbierz całą kopię, nawet po restarcie"
hoo_help_copy_note1: "Kopia, za którą nie możesz zapłacić w całości, czeka jako duch i rusza sama, gdy pojawiają się materiały - przy tobie, w plecaku AdventureBackpacks lub w skrzyniach w zasięgu z AzuCraftyBoxes - dopóki jesteś w promieniu $1m. Zapisuje się razem ze światem, a inni gracze z modem widzą jej ducha. Panel budowy pokazuje, czego jeszcze brakuje."
hoo_help_copy_note2: "Cofnięcie rozbiera kopię i oddaje materiały tam, skąd pochodzą - do skrzyń, które je trzymają, do plecaka, do ekwipunku - a to, co nigdzie się nie mieści, ląduje u twoich stóp. Działa, dopóki trzymasz kopię, więc możesz postawić kilka i zdejmować je po kolei."
hoo_help_models: "Makiety"
hoo_help_model_toggle: "Trzymając kopię lub plan: zmień w miniaturę"
hoo_help_model_size: "Większa / mniejsza makieta"
hoo_help_model_raise: "Podnieś / opuść precyzyjnie, o centymetr na naciśnięcie"
hoo_help_model_place: "Postaw na blacie stołu lub podłodze"
hoo_help_model_off: "Na jej stole: zdejmij makietę"
hoo_help_model_note: "Makieta jest rysowana, nie budowana: jeden zapisany obiekt niezależnie od wielkości budowli, kosztujący jedną żywicę oraz jedno drewno i jeden kamień, jeśli budowla ich używa. Cofnięcie znów ją zdejmuje. Makiety dalej niż $1m nie są rysowane."
hoo_help_blueprints: "Plany"
hoo_help_bp_book: "Z młotem w ręce: otwórz księgę planów"
hoo_help_bp_save: "Z zaznaczeniem i pustymi rękami: zapisz je jako plan"
hoo_help_bp_preview: "Obracaj / przybliżaj podgląd makiety; przycisk powyżej zapisuje ten widok jako obrazek"
hoo_help_bp_note1: "Plany to pliki PlanBuild trzymane w BepInEx/config/PlanBuild - otwierają się tu plany PlanBuild, Infinity Hammer i BuildShare, a PlanBuild i Infinity Hammer mogą otworzyć twoje. Przeskalowane elementy zachowują rozmiar we wszystkich trzech; zgięcia widać też w Infinity Hammer, tam gdzie ten mod jest zainstalowany. Wzięty plan trzyma się i stawia dokładnie jak kopię."
hoo_help_bp_note2: "Zapis na istniejący plan najpierw pyta i zachowuje stary jako plik .bak. Zaznaczenie pamięta plan, jako który je zapisano lub z którego je zbudowano. Elementy z modów niezainstalowanych tutaj, rozmiary poza limitami serwera i kształtowanie terenu (opcja w księdze) są pokazywane przed postawieniem."
hoo_help_runs: "Rzędy zoop i natychmiastowe cofanie"
hoo_help_runs_zoop: "Rozciągnij linię lub siatkę kopii (zoop) przed postawieniem"
hoo_help_runs_gap_wider: "Większy odstęp"
hoo_help_runs_gap_narrower: "Mniejszy odstęp / nakładanie"
hoo_help_runs_undo: "Cofnij: cofnij ostatnią czynność - rząd, kopię, przesunięcie, rozbiórkę"
hoo_help_runs_redo: "Ponów: zrób znowu ostatnio cofnięte (odbudowane elementy są płatne ponownie)"
hoo_help_runs_gap_none: "brak, stykają się"
hoo_help_runs_gap_metres: "$1m"
hoo_help_runs_gap_overlap: "$1m nakładania"
hoo_help_runs_note: "Odstęp między kopiami: $1, co $2m. $3 zeruje go razem z zoopem. Stawia do $4 kopii jednym kliknięciem. Cofanie pamięta ostatnie $5 akcji stawiania,"
hoo_help_runs_note_refund: "zwracając surowce prosto do ekwipunku."
hoo_help_runs_note_drop: "zrzucając materiały w miejscach elementów."
hoo_help_camera: "Odłączona kamera budowania"
hoo_help_cam_toggle: "Włącz/wyłącz swobodnie latającą kamerę budowania"
hoo_help_cam_fly: "Lataj nad budową (W / A / S / D)"
hoo_help_cam_vertical: "Lataj pionowo w górę i w dół"
hoo_help_cam_boost: "Szybki lot kamery"
hoo_help_cam_note: "Postać zostaje w miejscu, a stawianie celuje z latającej kamery. Zasięg kamery: $1m od postaci."
hoo_help_cam_note_pickup: "Kamera podnosi leżące przedmioty podczas lotu."
hoo_help_doors: "Drzwi"
hoo_help_doors_open: "Otwórz drzwi, w które celujesz, trzymając narzędzie do budowania"
hoo_help_doors_note: "Zasięg: $1m. Tylko drzwi - skrzynie, stacje i wszystko inne są zablokowane, gdy trzymasz narzędzie do budowania, by nic nie otworzyło się przypadkiem, gdy ustawiasz element."
hoo_help_stations: "Zasięg warsztatu i rozszerzony zasięg"
hoo_help_stations_radius: "Zwiększ lub zmniejsz promień warsztatu"
hoo_help_stations_note: "Konfigurowalny promień: od $1m do $2m. Promień jest zapisywany dla każdej stacji."
hoo_help_stations_note_reach: "Zasięg budowania obejmuje całą aurę warsztatu (do $1m)."
hoo_more_kinds: "jeszcze rodzajów: $1"
hoo_more_kinds_in_log: "jeszcze rodzajów: $1, lista w logu"
