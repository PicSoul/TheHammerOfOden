hoo_help_bend_straighten: "将部件拉直"
hoo_help_bend_note: "按住 $1 时,指示器会点亮弯曲所绕的圆环,并有消息告诉你两端会向哪个方向弯 - 上、下、左、右、朝向你或远离你。部件沿最长边弯曲,最多 $2° (180° 会把直梁变成半圆拱)。只有实心结构部件能弯曲;建造菜单会用一个小拱形标记它们。"
