hoo_help_master: "总开关"
hoo_help_master_toggle: "开启或关闭整个模组"
hoo_help_master_note1: "激活时锤子会发光并冒出细微的火星。除建造镜头外,所有功能只作用于建造工具,因此锄头、耕耘机和其他模组的地形工具只能使用镜头。关闭模组会归还它的按键并不再干预游戏 - 已经弯曲或缩放过的部件会保持形状。"
hoo_help_master_note1_still: "旋转、缩放、弯曲、微调和连放只在你站着不动时有效。"
hoo_help_master_note2: "角落的提示条显示当前可用的按键,并会在你按住修饰键、手持副本或有选择时变化。消息显示在模组自己的面板中,停留足够长的时间以便阅读。当你的建筑正在建起时,会有面板列出它还缺什么。三者都可以在配置中移动和调整大小:Key Hints、Messages、Building Panel。"
