hoo_help_sel_clear: "清除选择"
hoo_help_sel_note: "手持建造工具时,已选部件会发光。选择永远不会移除部件,即使中键是锤子的移除键。一次选择最多 $1 个部件,会一直保留到你清除它或离开世界。"
hoo_help_sel_note_count: "当前已选 $1 个。"
hoo_help_sel_note_none: "当前未选择任何东西。"
hoo_help_groups: "移动、复制和拆除选择"
hoo_help_groups_move: "原地移动整个选择 - 箱子保留其中物品"
hoo_help_groups_copy: "复制选择,以便在别处建造"
hoo_help_groups_takedown: "拆除选择 - 材料退还,撤销会重新建起"
hoo_help_groups_save: "手中无物时:将选择保存为蓝图"
hoo_help_groups_note1: "手持的组用等比缩放键均匀缩放,并像单个部件一样旋转和微调。副本是新部件:箱子是空的,展示架没有物品,告示牌文字会一起复制。"
hoo_help_groups_note_unlearned_in: "植物会被略过,你未学会的部件会被包含 (由服务器设定)。"
hoo_help_groups_note_unlearned_out: "植物会被略过,你未学会的部件也会被略过 - 并列出它们。"
hoo_help_groups_note2: "移动、复制或拆除选择不需要工作台。无法移动或拆除的部件 - 他人的守护石、正在使用 - 会被列出并取消选择。"
hoo_help_copying: "副本与工地"
hoo_help_copy_place: "放置:你付得起的部分从下往上飞入就位。副本仍在手中,可再次放置"
hoo_help_copy_stop: "在仍在建起的建筑上:就地停止"
hoo_help_copy_takedown: "在副本的任一部件上:拆除整个副本,即使重启后也可以"
hoo_help_copy_note1: "无法一次付清的副本会以幻影形式等待,并在材料出现时自动继续 - 你身上、AdventureBackpacks 背包中,或装有 AzuCraftyBoxes 时范围内的箱子中 - 只要你在 $1m 之内。它会随世界一起保存,其他装有此模组的玩家也能看到它的幻影。工地面板会列出它还缺什么。"
hoo_help_copy_note2: "撤销会拆除副本并把材料退回原处 - 存放它们的箱子、你的背包、你的物品栏 - 无处可放的会掉在你脚下。只要你还手持副本就有效,所以你可以放下多个再逐个撤回。"
hoo_help_models: "模型"
hoo_help_model_toggle: "手持副本或蓝图时:把它变成微缩模型"
hoo_help_model_size: "放大 / 缩小模型"
hoo_help_model_raise: "精细升高 / 降低,每次一厘米"
hoo_help_model_place: "把它放在桌面或地板上"
hoo_help_model_off: "在它的桌子上:取下模型"
hoo_help_model_note: "模型是绘制出来的,而不是建造的:无论建筑多大,都只保存为一个物体,花费一份树脂,若建筑用到木材和石头则再各加一份。撤销会再次取下它。超过 $1m 的模型不会绘制。"
hoo_help_blueprints: "蓝图"
hoo_help_bp_book: "手持锤子时:打开蓝图书"
hoo_help_bp_save: "有选择且手中无物时:保存为蓝图"
hoo_help_bp_preview: "旋转 / 缩放模型预览;上方按钮会把该视角保存为图片"
hoo_help_bp_note1: "蓝图是 PlanBuild 文件,保存在 BepInEx/config/PlanBuild - PlanBuild、Infinity Hammer 和 BuildShare 的蓝图都能在这里打开,PlanBuild 和 Infinity Hammer 也能打开你的蓝图。缩放过的部件在三者中都保持大小;在安装了本模组的情况下,弯曲在 Infinity Hammer 中也会显示。拿起的蓝图与副本的手持和放置方式完全相同。"
hoo_help_bp_note2: "覆盖保存蓝图前会先询问,并把旧的保留为 .bak 文件。选择会记住它保存成的或建造自的蓝图。来自此处未安装模组的部件、超出服务器上限的尺寸,以及地形塑造 (书中的一个选项) 都会在放置前显示。"
