hoo_help_snapping: "吸附点与原地编辑"
hoo_help_snap_cycle: "切换派生的中心、面和边吸附点"
hoo_help_snap_edit: "原地编辑:拿起已建好的部件来调整大小、旋转或重新定位"
hoo_help_snap_note: "被编辑的部件一开始会冻结在原位,所以小调整依然很小;按 $1 让它跟随视线做较大移动。放置或取消会释放它。编辑会保留部件的耐久和材料,不额外花费。装有东西的容器、告示牌和物品展示架不能单独编辑 - 请选中它们并移动选择,这样能保留里面的东西。"
hoo_help_selecting: "选择多个部件"
